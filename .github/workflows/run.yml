name: Reddit to Discord Feed

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: reddit-to-discord-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests curl_cffi
      - name: Run script
        env:
          DISCORD_CHANNELS: ${{ secrets.DISCORD_CHANNELS }}
          REDDIT_COOKIE: ${{ secrets.REDDIT_COOKIE }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python bot.py
      - name: Save posted history
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add posted.json
          if ! git diff --cached --quiet; then
            git commit -m "Update posted IDs [skip ci]"
            git pull --rebase origin main
            git push
          fi
