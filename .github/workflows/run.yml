name: Reddit to Discord Feed

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run script
        env:
          REDDIT_COOKIE: ${{ secrets.REDDIT_COOKIE }}
          DISCORD_CHANNELS: ${{ secrets.DISCORD_CHANNELS }}
        run: python bot.py
      - name: Save posted history
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add posted.json
          git commit -m "Update posted IDs" || exit 0
          git push
