name: Reddit to Discord Feed

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

concurrency:
  group: reddit-to-discord-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run script
        timeout-minutes: 8
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CONFIG_CHANNEL: ${{ vars.CONFIG_CHANNEL }}
        run: python bot.py
      - name: Save posted history
        if: ${{ !cancelled() }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          cp posted.json /tmp/posted.json
          cp rotation.json /tmp/rotation.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'EOF'
          import json
          def load(path):
              try:
                  with open(path, encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return []
          merged = list(dict.fromkeys(load("posted.json") + load("/tmp/posted.json")))[-3000:]
          with open("posted.json", "w", encoding="utf-8") as f:
              json.dump(merged, f)
          EOF
            cp /tmp/rotation.json rotation.json
            git add posted.json rotation.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Update feed state [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
