name: Reddit to Discord Feed

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

concurrency:
  group: reddit-to-discord-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run script
        env:
          CHANNELS: ${{ secrets.CHANNELS }}
          DISCORD_CHANNELS: ${{ secrets.DISCORD_CHANNELS }}
          REDGIFS_CHANNELS: ${{ secrets.REDGIFS_CHANNELS }}
        run: python bot.py
      - name: Save posted history
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add posted.json rotation.json
          if ! git diff --cached --quiet; then
            git commit -m "Update feed state [skip ci]"
            git pull --rebase origin main
            git push
          fi
