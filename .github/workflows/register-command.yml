name: Register command

on:
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Register /when
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python register_command.py
